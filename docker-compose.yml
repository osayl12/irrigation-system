name: irrigation-system

# Production stack for the Oracle VM (/var/www/irrigation-system).
# Only `web` is published to the host (:8083, like velocityviper's :8081); the
# VM's reverse proxy terminates TLS for irrigation-system.duckdns.org and
# forwards to it. External traffic is gated by the Oracle security list (80/443
# only), same as your other projects.
#
#   local test:  docker compose up --build
#   on the VM:   docker compose pull && docker compose up -d --force-recreate

services:
  db:
    image: mysql:8.0
    container_name: irrigation-db
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: irrigation_system
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/irrigation_system.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    container_name: irrigation-mqtt
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    # A real ESP32 over the internet would connect here. To allow that: add
    # authentication to mosquitto.conf, uncomment below, and open 1883 in the
    # Oracle Cloud security list + VM firewall.
    # ports:
    #   - "1883:1883"

  api:
    image: osayl1997/irrigation-system-api:latest
    build: ./BackEnd
    container_name: irrigation-api
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: db
      USER_DB: root
      PASSWORD_DB: ""
      DATABASE: irrigation_system
      MQTT_URL: mqtt://mqtt:1883
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

  web:
    image: osayl1997/irrigation-system-web:latest
    build: ./web-client
    container_name: irrigation-web
    restart: unless-stopped
    ports:
      - "8083:80"
    depends_on:
      - api

volumes:
  db_data:
  mqtt_data:
