name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./BackEnd
          push: true
          tags: osayl1997/irrigation-system-api:latest

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./web-client
          push: true
          tags: osayl1997/irrigation-system-web:latest

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            if [ ! -d /var/www/irrigation-system/.git ]; then
              git clone https://github.com/osayl12/irrigation-system.git /var/www/irrigation-system
            fi
            cd /var/www/irrigation-system
            git fetch origin main
            git reset --hard origin/main
            docker compose pull
            docker compose up -d --force-recreate --remove-orphans
            docker image prune -f
